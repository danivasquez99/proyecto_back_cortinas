# Nombre del proyecto
spring.application.name=Proyecto_Lenguajes

# ===============================================
# CONFIGURACI\u00d3N DE LA BASE DE DATOS (Railway)
# ===============================================
spring.datasource.url=jdbc:mysql://switchback.proxy.rlwy.net:22535/railway
spring.datasource.username=root
spring.datasource.password=lnsagDnAWqcbdHVNrKFZerJCpjcOyJSH
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update        
spring.jpa.show-sql=true                      
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false                 
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Zona horaria y codificaci\u00f3n
spring.datasource.hikari.connection-init-sql=SET time_zone = '-06:00'
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-timeout=20000

# ===============================================
# CONFIGURACI\u00d3N DE RECURSOS EST\u00c1TICOS E IM\u00c1GENES
# ===============================================
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Configuraci\u00f3n espec\u00edfica para im\u00e1genes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuraci\u00f3n de DevTools para recarga autom\u00e1tica (IMPORTANTE)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/static/images

# Cache deshabilitado para desarrollo
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Ruta y URL base para im\u00e1genes de sorteos
app.images.dir=src/main/resources/static/images/raffle
app.images.baseurl=http://localhost:8080/images/raffle
